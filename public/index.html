<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Postwoman</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%238b7bff'/%3E%3Cstop offset='1' stop-color='%2300e0b8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='9' fill='url(%23g)'/%3E%3Cpath d='M9 22l7-12 7 12' stroke='%230b0d12' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="with-side">
  <header id="topbar">
    <div class="logo"><i>⚡</i>Postwoman</div>
    <button class="btn ghost" id="btnSide" title="Toggle sidebar">☰</button>
    <button class="btn" id="btnPalette" title="Search tabs, jump, run actions">🔎 Jump to… <span class="kbd">Ctrl K</span></button>
    <div class="spacer"></div>
    <button class="btn" id="btnCurl" title="Paste a cURL command into a new tab">⌘ Import cURL</button>
    <button class="btn" id="btnAI" title="Connect Claude, Claude Code, GitHub Copilot and other AI agents">🤖 AI agents</button>
    <div class="envsel">
      <span class="dot" id="envDot"></span>
      <select id="envSelect" title="Active environment"></select>
      <button class="btn" id="btnEnv" title="Edit environments &amp; variables">{{vars}}</button>
    </div>
    <button class="btn ghost" id="btnData" title="Export / import everything">⇅</button>
    <button class="btn ghost" id="btnTheme" title="Toggle light / dark">🌗</button>
  </header>

  <nav id="strip"></nav>

  <aside id="side">
    <div class="side-h">
      <input class="search" id="q" placeholder="Search name, url, #tag, group…" autocomplete="off">
      <div class="tagrow" id="tagFilter"></div>
    </div>
    <div id="list"></div>
  </aside>

  <main id="work"></main>
</div>

<div id="toasts"></div>
<div id="overlay"></div>

<script src="curl.js"></script>
<script src="stats.js"></script>
<script src="diff.js"></script>
<script src="loadkit.js"></script>
<script src="reqspec.js"></script>
<script src="codegen.js"></script>
<script src="checks.js"></script>
<script src="sync.js"></script>
<script src="tree.js"></script>
<script src="store.js"></script>
<script src="ui-tabs.js"></script>
<script src="ui-request.js"></script>
<script src="ui-response.js"></script>
<script src="ui-runner.js"></script>
<script src="ui-compare.js"></script>
<script src="chart.js"></script>
<script src="ui-load.js"></script>
<script src="ui-agent.js"></script>
<script src="ui-env.js"></script>
<script src="ui-palette.js"></script>
<script src="main.js"></script>
</body>
</html>
